name: CI Dry Bean

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Validar entorno y c?digo
        run: |
          python -m pip check
          python -m compileall -q main.py src deploy/web
      - name: Ejecutar pruebas con el dataset local
        run: python -m pytest -q
      - name: Validar configuraci?n de Docker Compose
        run: docker compose -f docker-compose.yaml -f docker-compose.dev.yaml --profile mlops --profile monitoring config --quiet
