name: drybean
services:
  api:
    image: drybean-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
      target: api
    environment:
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-1000}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-2097152}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DRYBEAN_PREDICTION_LOG: /app/logs/predictions.jsonl
    restart: unless-stopped
    read_only: true
    volumes:
      - ./outputs/models/mlops:/app/outputs/models/mlops:ro
      - ./logs:/app/logs
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [app]
  dashboard:
    image: drybean-dashboard:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
      target: dashboard
    environment:
      API_BASE_URL: http://api:8000
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-1000}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-2097152}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [app, web]
  mlflow:
    profiles: [mlops]
    image: ghcr.io/mlflow/mlflow:v3.7.0
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - localhost:5000,127.0.0.1:5000,mlflow:5000
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped
    networks: [web]
networks:
  app:
    internal: true
  web:
volumes:
  mlflow_data:
